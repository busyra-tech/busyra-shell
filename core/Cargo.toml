[package]
name = "djie-core"
version = "0.1.0"
edition = "2024"
description = "Djie Shell shared core: vault, models, SSH, sync"
license = "MIT"
publish = false

[lib]
name = "djie_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "std"] }

russh = "0.65"
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "net"] }

[profile.release]
lto = true
opt-level = 3
strip = true
