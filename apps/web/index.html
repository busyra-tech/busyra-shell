<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0c12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Busyra Shell — SSH Client untuk Mac, Windows & Linux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #0a0c12;
        --panel: #12161f;
        --panel-2: #181d28;
        --ink: #e9eef6;
        --ink-2: #a3acbd;
        --ink-3: #697286;
        --line: #232a37;
        --teal: #3fd0b4;
        --blue: #5b9cf5;
        --violet: #9d7cf2;
        --live: #4ade80;
        --grad: linear-gradient(115deg, #2fc4a8 0%, #4d8ff0 50%, #8f6ef0 100%);
        --f-display: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --f-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --f-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      body {
        font-family: var(--f-body);
        background-color: var(--paper);
        color: var(--ink);
      }
      h1, h2, h3, h4, .font-display {
        font-family: var(--f-display);
        letter-spacing: -0.02em;
      }
      code, pre, .font-mono {
        font-family: var(--f-mono);
      }
    </style>
  </head>
  <body class="bg-[#0a0c12] text-[#e9eef6] antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
